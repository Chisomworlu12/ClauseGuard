name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clauseguard
          POSTGRES_PASSWORD: clauseguard
          POSTGRES_DB: clauseguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://clauseguard:clauseguard@localhost:5432/clauseguard

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest

  eval-gate:
    name: Evaluation regression gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
      - name: Run evaluation gate
        run: uv run python -m eval.ci_gate

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, eval-gate]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t clauseguard:${{ github.sha }} .