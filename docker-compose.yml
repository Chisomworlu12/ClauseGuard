services:
  db:
    image: postgres:16
    container_name: clauseguard-db
    environment:
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: clauseguard
      POSTGRES_DB: clauseguard
    ports:
      - "5433:5432"
    volumes:
      - clauseguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clauseguard_pgdata:
